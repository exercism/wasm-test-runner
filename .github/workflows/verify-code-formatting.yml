name: wasm-test-runner / format

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Install pnpm'
        run: npm install -g pnpm
      - name: 'Verify formatting of all files'
        run: ./bin/check-formatting.sh
